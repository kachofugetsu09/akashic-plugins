name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR 之间互相取消；main 上的构建与发布排成一条队，不取消正在跑的发布。
# 排队中的运行只保留最新一个，而每次运行都按自己的提交全量构建，所以最新的一个总是包含之前的改动。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Core 的检出路径与合成源码路径；Core 版本只由 CORE_REF 决定。
  CORE_DIR: ${{ github.workspace }}/core
  SYNTH_DIR: ${{ github.workspace }}/synth
  REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  check-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out extra
        uses: actions/checkout@v4
        with:
          path: extra
          fetch-depth: 1

      - name: Read pinned Core version
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < extra/CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Core
        uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: ${{ steps.pin.outputs.ref }}
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 已发布的迁移只能追加：用固定版本 Core 的检查脚本对本仓库跑，不另写一份逻辑。
      - name: Published migrations are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C extra fetch --no-tags --depth=1 origin "$BASE_SHA"
          python core/scripts/check_yoyo_migrations.py --root extra --base "$BASE_SHA"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: core/requirements*.txt

      - name: Compose Core and extra sources
        run: python extra/scripts/extra_ci.py compose --core "$CORE_DIR" --synth "$SYNTH_DIR"

      - name: Cache bundled wheel sdists
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bundled-wheels-cache
          key: bundled-wheels-${{ hashFiles('extra/wheels.lock.json') }}

      # plugin_boundary 只用标准库，与 uv 安装重叠起跑；.venv 就绪后并发跑其余 Python 门禁与测试。
      - name: Install Python deps and run checks
        env:
          BUNDLED_WHEELS_CACHE_DIR: ${{ runner.temp }}/bundled-wheels-cache
        run: |
          boundary_log="$RUNNER_TEMP/plugin_boundary.log"
          (cd "$SYNTH_DIR" && python scripts/plugin_boundary.py check) >"$boundary_log" 2>&1 &
          boundary_pid=$!

          uv venv "$SYNTH_DIR/.venv" --python 3.12
          uv pip install --python "$SYNTH_DIR/.venv" -r "$SYNTH_DIR/requirements-dev.txt" -e "$SYNTH_DIR/sdk/python"
          export PATH="$SYNTH_DIR/.venv/bin:$PATH"

          verify_rc=0
          "$SYNTH_DIR/.venv/bin/python" extra/scripts/extra_ci.py verify \
            --scope python --skip-boundary --core "$CORE_DIR" --synth "$SYNTH_DIR" || verify_rc=$?

          boundary_rc=0
          wait "$boundary_pid" || boundary_rc=$?
          if [ "$boundary_rc" -eq 0 ]; then
            echo "::group::Plugin boundary gate (PASS)"
            cat "$boundary_log"
            echo "::endgroup::"
          else
            echo "::error::Plugin boundary gate failed (exit=$boundary_rc)"
            cat "$boundary_log"
          fi
          [ "$verify_rc" -eq 0 ] && [ "$boundary_rc" -eq 0 ]

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out extra
        uses: actions/checkout@v4
        with:
          path: extra
          fetch-depth: 1

      - name: Read pinned Core version
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < extra/CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Core
        uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: ${{ steps.pin.outputs.ref }}
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Compose Core and extra sources
        run: python extra/scripts/extra_ci.py compose --core "$CORE_DIR" --synth "$SYNTH_DIR"

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: synth/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('core/package-lock.json') }}

      - name: Cache tsgo
        id: tsgo-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tsgo
          key: tsgo-${{ runner.os }}-7.0.0-dev.20260707.2

      - name: Install Node dependencies (on cache miss)
        working-directory: synth
        env:
          NODE_MODULES_HIT: ${{ steps.node-modules-cache.outputs.cache-hit }}
          TSGO_HIT: ${{ steps.tsgo-cache.outputs.cache-hit }}
        run: |
          npm_pid=""
          tsgo_pid=""
          if [ "$NODE_MODULES_HIT" != "true" ]; then
            npm ci --ignore-scripts --prefer-offline --no-audit --no-fund &
            npm_pid=$!
          fi
          if [ "$TSGO_HIT" != "true" ]; then
            (
              mkdir -p "$RUNNER_TEMP/tsgo"
              npm --prefix "$RUNNER_TEMP/tsgo" install --no-save --no-audit --no-fund @typescript/native-preview@7.0.0-dev.20260707.2
            ) &
            tsgo_pid=$!
          fi
          if [ -n "$npm_pid" ]; then wait "$npm_pid"; fi
          if [ -n "$tsgo_pid" ]; then wait "$tsgo_pid"; fi
          echo "$RUNNER_TEMP/tsgo/node_modules/.bin" >> "$GITHUB_PATH"

      # 并发执行前端检查（tsgo + 样式/动效合同）与 release 分支构建（复用 node_modules，只用标准库 Python）。
      - name: Verify frontend and build release branches
        run: |
          python extra/scripts/extra_ci.py verify --scope web --core "$CORE_DIR" --synth "$SYNTH_DIR" \
            --bare "$RUNNER_TEMP/release.git" --plan "$RUNNER_TEMP/plan.json" --remote "$REMOTE_URL"

      - name: Upload build result
        if: github.event_name != 'pull_request'
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/build.tgz" release.git plan.json

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: ${{ runner.temp }}/build.tgz
          retention-days: 7

  publish:
    needs: [check-python, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out extra
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-build
          path: ${{ runner.temp }}

      # 只发布 main 当前的最新提交：重跑旧运行或乱序时直接跳过，不会把分支推回旧内容。
      - name: Skip if this commit is no longer the tip of main
        id: tip
        run: |
          tip=$(git ls-remote "$REMOTE_URL" refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "stale, tip is $tip; skip"; fi

      # 租约保证远端分支仍停在构建时看到的提交，否则推送失败而不是覆盖更新的内容。
      - name: Push changed release branches
        if: steps.tip.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/build.tgz"
          python scripts/extra_ci.py push --bare "$RUNNER_TEMP/release.git" --plan "$RUNNER_TEMP/plan.json" \
            --remote "https://x-access-token:${GITHUB_TOKEN}@${REMOTE_URL#https://}"
