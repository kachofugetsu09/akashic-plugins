name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR 之间互相取消；main 上的构建与发布排成一条队，不取消正在跑的发布。
# 排队中的运行只保留最新一个，而每次运行都按自己的提交全量构建，所以最新的一个总是包含之前的改动。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Core 的检出路径与合成源码路径；Core 版本只由 CORE_REF 决定。
  CORE_DIR: ${{ github.workspace }}/core
  SYNTH_DIR: ${{ github.workspace }}/synth
  REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  # 零第三方依赖：迁移追加检查 + 边界门禁 + bundled wheel 重建校验。
  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out extra
        uses: actions/checkout@v4
        with:
          path: extra
          fetch-depth: 1

      - name: Read pinned Core version
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < extra/CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Core
        uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: ${{ steps.pin.outputs.ref }}
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Published migrations are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C extra fetch --no-tags --depth=1 origin "$BASE_SHA"
          python core/scripts/check_yoyo_migrations.py --root extra --base "$BASE_SHA"

      - name: Compose Core and extra sources
        run: python extra/scripts/extra_ci.py compose --core "$CORE_DIR" --synth "$SYNTH_DIR"

      - name: Cache bundled wheel sdists
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bundled-wheels-cache
          key: bundled-wheels-${{ hashFiles('extra/wheels.lock.json') }}

      - name: Boundary gate and bundled wheels
        env:
          BUNDLED_WHEELS_CACHE_DIR: ${{ runner.temp }}/bundled-wheels-cache
        run: python extra/scripts/extra_ci.py verify --scope static --core "$CORE_DIR" --synth "$SYNTH_DIR"

  # 独享 runner：ruff + pyright --threads + 进程内依赖声明检查（直接复用缓存的 .venv）。
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out extra
        uses: actions/checkout@v4
        with:
          path: extra
          fetch-depth: 1

      - name: Read pinned Core version
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < extra/CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Core
        uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: ${{ steps.pin.outputs.ref }}
          path: core

      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compose Core and extra sources
        run: python extra/scripts/extra_ci.py compose --core "$CORE_DIR" --synth "$SYNTH_DIR"

      # 直接用 uv 安装（实测 ~5s），比恢复几百 MB 的 .venv/uv 缓存更稳更快。
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install Python deps, lint, typecheck and check in-process deps
        working-directory: synth
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv -r requirements-dev.txt -e sdk/python
          req_args=()
          for req in plugins/*/requirements.inprocess.txt; do
            [ -s "$req" ] && req_args+=(-r "$req")
          done
          wheel_args=()
          for wdir in plugins/*/wheels; do
            [ -d "$wdir" ] && wheel_args+=(--find-links "$wdir")
          done
          if [ ${#req_args[@]} -gt 0 ]; then
            uv pip install --python .venv "${wheel_args[@]}" "${req_args[@]}"
          fi
          export PATH="$SYNTH_DIR/.venv/bin:$PATH"
          "$SYNTH_DIR/.venv/bin/python" ../extra/scripts/extra_ci.py verify --scope lint --core "$CORE_DIR" --synth "$SYNTH_DIR"

  # 独享 runner：pytest -n 2。
  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out extra
        uses: actions/checkout@v4
        with:
          path: extra
          fetch-depth: 1

      - name: Read pinned Core version
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < extra/CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Core
        uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: ${{ steps.pin.outputs.ref }}
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compose Core and extra sources
        run: python extra/scripts/extra_ci.py compose --core "$CORE_DIR" --synth "$SYNTH_DIR"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install Python deps and run plugin tests
        working-directory: synth
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv -r requirements-dev.txt -e sdk/python
          req_args=()
          for req in plugins/*/requirements.inprocess.txt; do
            [ -s "$req" ] && req_args+=(-r "$req")
          done
          wheel_args=()
          for wdir in plugins/*/wheels; do
            [ -d "$wdir" ] && wheel_args+=(--find-links "$wdir")
          done
          if [ ${#req_args[@]} -gt 0 ]; then
            uv pip install --python .venv "${wheel_args[@]}" "${req_args[@]}"
          fi
          export PATH="$SYNTH_DIR/.venv/bin:$PATH"
          "$SYNTH_DIR/.venv/bin/python" ../extra/scripts/extra_ci.py verify --scope test --core "$CORE_DIR" --synth "$SYNTH_DIR"

  # 零 Python 第三方依赖：tsgo + 样式/动效合同 + 构建 release 分支（单次缓存恢复 node_modules + tsgo）。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out extra
        uses: actions/checkout@v4
        with:
          path: extra
          fetch-depth: 1

      - name: Read pinned Core version
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < extra/CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Core
        uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: ${{ steps.pin.outputs.ref }}
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compose Core and extra sources
        run: python extra/scripts/extra_ci.py compose --core "$CORE_DIR" --synth "$SYNTH_DIR"

      - name: Cache Node dependencies and tsgo
        id: node-cache
        uses: actions/cache@v4
        with:
          path: |
            synth/node_modules
            ${{ runner.temp }}/tsgo
          key: node-and-tsgo-${{ runner.os }}-node22-tsgo7.0.0-dev.20260707.2-${{ hashFiles('core/package-lock.json') }}

      - name: Install Node dependencies and tsgo (on cache miss)
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: synth
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund &
          npm_pid=$!
          (
            mkdir -p "$RUNNER_TEMP/tsgo"
            npm --prefix "$RUNNER_TEMP/tsgo" install --no-save --no-audit --no-fund @typescript/native-preview@7.0.0-dev.20260707.2
          ) &
          tsgo_pid=$!
          wait "$npm_pid"
          wait "$tsgo_pid"

      - name: Cache kubai_icons plugin dependencies
        id: kubai-cache
        uses: actions/cache@v4
        with:
          path: synth/frontend/plugins/kubai_icons/node_modules
          key: kubai-icons-${{ runner.os }}-node22-${{ hashFiles('extra/frontend/plugins/kubai_icons/package-lock.json') }}

      - name: Install kubai_icons plugin dependencies (on cache miss)
        if: steps.kubai-cache.outputs.cache-hit != 'true'
        working-directory: synth/frontend/plugins/kubai_icons
        run: npm ci --ignore-scripts --omit=peer --prefer-offline --no-audit --no-fund

      - name: Verify frontend and build release branches
        run: |
          export PATH="$RUNNER_TEMP/tsgo/node_modules/.bin:$PATH"
          python extra/scripts/extra_ci.py verify --scope web --core "$CORE_DIR" --synth "$SYNTH_DIR" \
            --bare "$RUNNER_TEMP/release.git" --plan "$RUNNER_TEMP/plan.json" --remote "$REMOTE_URL"

      - name: Upload build result
        if: github.event_name != 'pull_request'
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/build.tgz" release.git plan.json

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: ${{ runner.temp }}/build.tgz
          retention-days: 7

  publish:
    needs: [python-static, python-lint, python-test, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out extra
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-build
          path: ${{ runner.temp }}

      # 只发布 main 当前的最新提交：重跑旧运行或乱序时直接跳过，不会把分支推回旧内容。
      - name: Skip if this commit is no longer the tip of main
        id: tip
        run: |
          tip=$(git ls-remote "$REMOTE_URL" refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "stale, tip is $tip; skip"; fi

      # 租约保证远端分支仍停在构建时看到的提交，否则推送失败而不是覆盖更新的内容。
      - name: Push changed release branches
        if: steps.tip.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/build.tgz"
          python scripts/extra_ci.py push --bare "$RUNNER_TEMP/release.git" --plan "$RUNNER_TEMP/plan.json" \
            --remote "https://x-access-token:${GITHUB_TOKEN}@${REMOTE_URL#https://}"
